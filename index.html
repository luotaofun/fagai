<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="酉阳、秀山发展改革项目批复监测与分析工作台。">
<title>发改批复监测工作台</title>
<style>:root {
  color-scheme: light;
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-subtle: #f8f9fb;
  --ink: #182230;
  --muted: #667085;
  --line: #e1e5ea;
  --line-strong: #cbd2da;
  --accent: #2f5f9e;
  --accent-hover: #244b7e;
  --accent-soft: #edf3fa;
  --focus: #7ba7d9;
  --shadow: 0 12px 36px rgba(20, 32, 48, .12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12161b;
  --surface: #191f26;
  --surface-subtle: #202730;
  --ink: #edf1f5;
  --muted: #a0abba;
  --line: #303944;
  --line-strong: #46515e;
  --accent: #8eb5e5;
  --accent-hover: #b3cff0;
  --accent-soft: #233246;
  --focus: #8eb5e5;
  --shadow: 0 12px 36px rgba(0, 0, 0, .32);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  min-width: 320px; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input, select { font: inherit; }
button, select { cursor: pointer; }
button { color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, tr:focus-visible, summary:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}
[hidden] { display: none !important; }
.skip-link { position: fixed; left: 16px; top: -60px; z-index: 100; background: var(--surface); padding: 8px 12px; border: 1px solid var(--line); }
.skip-link:focus { top: 12px; }

.app-header { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.header-inner { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; }
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; }
.brand-name { font-size: 14px; font-weight: 650; letter-spacing: .02em; }
.brand-scope { color: var(--muted); font-size: 10px; }
.top-nav { display: none; align-self: stretch; gap: 22px; }
.top-nav a { display: flex; align-items: center; color: var(--muted); text-decoration: none; font-size: 12px; border-bottom: 2px solid transparent; }
.top-nav a:hover { color: var(--ink); border-bottom-color: var(--line-strong); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.update-time { display: none; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }

.workspace { max-width: 1440px; margin: 0 auto; padding: 16px 14px 36px; }
.page-heading { display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }
h1 { font-size: 20px; line-height: 1.35; font-weight: 650; letter-spacing: -.02em; }
.page-heading p, .section-heading p { color: var(--muted); font-size: 12px; margin-top: 4px; }
.page-actions { display: flex; gap: 8px; }
.page-actions .button { flex: 1; }
.page-actions .panel-settings { flex: 1; }
.page-actions .panel-settings summary { width: 100%; }
.button {
  display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 7px 12px;
  border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink);
  text-decoration: none; font-size: 12px; font-weight: 500; line-height: 1.4; white-space: nowrap;
}
.button:hover { background: var(--surface-subtle); border-color: var(--muted); }
.button-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
html[data-theme="dark"] .button-primary { color: #122033; }
.button-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.button-quiet { border-color: transparent; background: transparent; color: var(--muted); }
.button-quiet:hover { color: var(--ink); border-color: var(--line); }
.button:disabled { opacity: .4; cursor: default; }

.filter-bar {
  display: flex; flex-wrap: wrap; gap: 10px; padding: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px 8px 0 0;
}
.filter-field { display: flex; flex-direction: column; gap: 5px; flex: 1 1 100%; min-width: 0; }
.filter-city, .filter-search { flex-basis: 100%; }
.field-label { color: var(--muted); font-size: 10px; line-height: 1.2; }
select, input[type="search"] {
  width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--surface); color: var(--ink); font-size: 13px; outline: none;
}
input[type="search"] { cursor: text; }
select:focus, input[type="search"]:focus { border-color: var(--focus); }
.segmented { display: flex; height: 38px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-subtle); }
.segmented button { flex: 1; min-width: 56px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font-size: 12px; }
.segmented button:hover { color: var(--ink); }
.segmented button.active { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.reset-button { margin-left: auto; }
.filter-status {
  display: flex; flex-direction: column; gap: 6px; padding: 10px 12px;
  border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px;
  color: var(--muted); font-size: 11px;
}
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-subtle); }
.filter-chip button { border: 0; background: transparent; color: var(--muted); padding: 0 2px; line-height: 1.2; }
.filter-chip button:hover { color: var(--ink); }

.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.kpi-card { min-width: 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.kpi-label { display: block; color: var(--muted); font-size: 11px; }
.kpi-value { display: block; margin-top: 6px; font-size: 20px; line-height: 1.2; font-weight: 620; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.kpi-note { display: block; min-height: 16px; margin-top: 6px; color: var(--muted); font-size: 10px; }

.analysis-section, .projects-section { margin-top: 26px; scroll-margin-top: 72px; }
.section-heading { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
h2 { font-size: 16px; line-height: 1.4; font-weight: 620; }
.section-meta { color: var(--muted); font-size: 11px; }
.panel-settings { position: relative; align-self: flex-start; }
.panel-settings summary { list-style: none; }
.panel-settings summary::-webkit-details-marker { display: none; }
.panel-menu { position: absolute; right: 0; top: 40px; z-index: 20; width: min(250px, calc(100vw - 28px)); padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
.panel-option { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 9px; border: 0; border-radius: 5px; background: transparent; text-align: left; cursor: pointer; }
.panel-option:hover { background: var(--surface-subtle); }
.panel-option .switch-mark { flex: none; width: 30px; height: 16px; margin-top: 2px; border: 1px solid var(--line-strong); border-radius: 99px; background: var(--surface-subtle); position: relative; transition: background .15s, border-color .15s; }
.panel-option .switch-mark::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.panel-option[aria-checked="true"] .switch-mark { background: var(--accent-soft); border-color: var(--accent); }
.panel-option[aria-checked="true"] .switch-mark::after { transform: translateX(14px); background: var(--accent); }
.panel-option span { display: block; font-size: 12px; }
.panel-option small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }

.analysis-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.analysis-panel { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.panel-header { min-height: 58px; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.panel-header h3 { font-size: 13px; font-weight: 600; }
.panel-header p { color: var(--muted); font-size: 10px; margin-top: 2px; }
.panel-body { padding: 14px; }
.module-toolbar { display: flex; align-items: center; gap: 8px; }
.module-footer { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
.module-footer:empty { display: none; }
.chart-legend { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 10px; }
.legend-items { display: flex; flex-wrap: wrap; gap: 12px; }
.chart-legend span { display: flex; align-items: center; gap: 5px; }
.legend-mark { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.metric-switch { display: flex; gap: 2px; padding: 2px; background: var(--surface-subtle); border: 1px solid var(--line); border-radius: 5px; }
.metric-switch button { padding: 4px 9px; border: 0; border-radius: 3px; background: transparent; color: var(--muted); font-size: 10px; }
.metric-switch button.active { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

.trend-chart { display: flex; gap: 6px; min-height: 190px; border-bottom: 1px solid var(--line); }
.trend-month { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; border-radius: 4px 4px 0 0; }
.trend-month.selected { background: var(--accent-soft); }
.trend-bars { height: 152px; display: flex; align-items: flex-end; justify-content: center; gap: 4px; width: 100%; }
.trend-bar { position: relative; width: min(20px, 30%); min-height: 1px; border: 0; border-radius: 3px 3px 0 0; padding: 0; }
.trend-bar:hover, .trend-bar:focus-visible { filter: brightness(.92); }
.trend-bar::after {
  content: attr(data-tooltip); position: absolute; left: 50%; bottom: calc(100% + 7px); transform: translateX(-50%);
  z-index: 10; width: max-content; max-width: 170px; padding: 4px 7px; border-radius: 4px; background: var(--ink); color: var(--bg);
  font-size: 10px; line-height: 1.4; opacity: 0; pointer-events: none; white-space: nowrap;
}
.trend-bar:hover::after, .trend-bar:focus-visible::after { opacity: 1; }
.trend-label { width: 100%; padding: 8px 0; text-align: center; color: var(--muted); font-size: 9px; white-space: nowrap; }

.category-list { display: grid; gap: 12px; }
.category-row { display: grid; grid-template-columns: 64px minmax(50px, 1fr) 62px; gap: 9px; align-items: center; width: 100%; border: 0; background: transparent; text-align: left; font-size: 11px; }
.category-row:hover .category-name { color: var(--accent); }
.category-row.selected .category-name { color: var(--accent); font-weight: 600; }
.category-track { height: 8px; border-radius: 3px; background: var(--surface-subtle); overflow: hidden; }
.category-fill { display: block; height: 100%; min-width: 2px; border-radius: 3px; background: var(--accent); }
.category-value { text-align: right; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
.chart-empty { padding: 40px 10px; text-align: center; color: var(--muted); font-size: 11px; }

.city-compare { display: grid; gap: 2px; }
.city-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 10px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
.city-row:last-child { border-bottom: 0; }
.city-name { display: flex; align-items: center; gap: 7px; flex: 0 0 58px; }
.city-select { border: 0; background: transparent; text-align: left; font-size: 11px; }
.city-select:hover { color: var(--accent); }
.city-name .legend-mark { flex: none; }
.city-track { flex: 1 1 100%; height: 9px; border-radius: 3px; background: var(--surface-subtle); overflow: hidden; }
.city-fill { display: block; height: 100%; min-width: 2px; border-radius: 3px; }
.city-number { font-variant-numeric: tabular-nums; }
.city-date { color: var(--muted); font-variant-numeric: tabular-nums; }

.table-container { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.table-scroll { overflow-x: auto; }
table { width: 100%; min-width: 760px; border-collapse: collapse; table-layout: fixed; }
th { padding: 10px 12px; background: var(--surface-subtle); border-bottom: 1px solid var(--line); color: var(--muted); text-align: left; font-size: 10px; font-weight: 500; }
th:nth-child(1) { width: 108px; } th:nth-child(2) { width: 66px; } th:nth-child(3) { width: 88px; }
th:nth-child(5) { width: 102px; } th:nth-child(6) { width: 176px; }
th.numeric, td.numeric { text-align: right; }
.sort-button { border: 0; background: transparent; color: inherit; padding: 0; font-size: inherit; }
.sort-button:hover, .sort-button.active { color: var(--accent); }
.sort-button.active::after { content: "降序"; margin-left: 5px; font-size: 9px; }
.sort-button.active.ascending::after { content: "升序"; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 11px; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-subtle); }
tbody tr:last-child td { border-bottom: 0; }
.cell-date, .cell-money { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cell-city { display: inline-flex; align-items: center; gap: 6px; }
.cell-city .legend-mark { width: 6px; height: 6px; }
.cell-category { color: var(--muted); }
.project-name { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }
.project-unit { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 10px; margin-top: 3px; }
.cell-doc { color: var(--muted); overflow-wrap: anywhere; }
.empty-state { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 12px; }
.empty-state .button { margin-top: 12px; }
.table-footer { min-height: 48px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
.pagination { display: flex; align-items: center; gap: 10px; }

.sources-section { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 26px; padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); scroll-margin-top: 72px; }
.sources-section p { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.85; }
.source-links { display: grid; align-content: start; gap: 6px; }
.source-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 11px; }
.source-card:last-child { border-bottom: 0; }
.source-card span { color: var(--muted); font-size: 10px; }
.source-card:hover { color: var(--accent); }
.app-footer { max-width: 1440px; margin: 0 auto; padding: 0 14px 24px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 10px; }

.drawer-mask { position: fixed; inset: 0; z-index: 50; background: rgba(14, 22, 32, .38); }
.detail-drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: 100%; display: flex; flex-direction: column; background: var(--surface); box-shadow: var(--shadow); }
.drawer-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 16px; border-bottom: 1px solid var(--line); }
.drawer-eyebrow { color: var(--muted); font-size: 10px; }
.drawer-header h2 { margin-top: 6px; font-size: 15px; line-height: 1.65; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
.detail-list { display: grid; grid-template-columns: 84px 1fr; gap: 9px 12px; font-size: 12px; }
.detail-list dt { color: var(--muted); }
.detail-list dd { overflow-wrap: anywhere; }
.document-section { margin-top: 22px; }
.document-section h3 { font-size: 13px; font-weight: 600; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
.document-content { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-subtle); white-space: pre-wrap; font-size: 12px; line-height: 1.9; }
.drawer-footer { display: flex; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 80; padding: 9px 14px; border-radius: 6px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); font-size: 12px; }

@media (min-width: 480px) {
  .trend-label { font-size: 10px; }
  .category-row { grid-template-columns: 72px minmax(60px, 1fr) 72px; }
}
@media (min-width: 760px) {
  .header-inner { padding: 0 24px; min-height: 58px; }
  .brand { flex-direction: row; align-items: baseline; gap: 10px; }
  .brand-name { font-size: 15px; }
  .update-time { display: inline; }
  .workspace { padding: 24px 24px 44px; }
  .page-heading { flex-direction: row; align-items: center; justify-content: space-between; }
  .page-actions { flex-direction: row; }
  .page-actions .button { flex: none; }
  .page-actions .panel-settings { flex: none; }
  .page-actions .panel-settings summary { width: auto; }
  h1 { font-size: 22px; }
  .filter-bar { align-items: flex-end; gap: 12px; padding: 14px 16px; }
  .filter-field { flex: 0 1 150px; }
  .filter-city { flex: 1 1 210px; }
  .filter-search { flex: 1 1 240px; }
  .reset-button { margin-left: 0; }
  .filter-status { flex-direction: row; align-items: center; justify-content: space-between; }
  .kpi-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi-value { font-size: 23px; }
  .section-heading { flex-direction: row; align-items: center; justify-content: space-between; }
  .chart-legend { flex-direction: row; align-items: center; justify-content: space-between; }
  .trend-bars { height: 160px; }
  .city-track { flex: 1 1 auto; }
  .table-footer { flex-direction: row; align-items: center; justify-content: space-between; }
  .sources-section { grid-template-columns: 1.5fr 1fr; gap: 32px; padding: 22px; }
  .app-footer { flex-direction: row; justify-content: space-between; padding: 0 24px 28px; }
  .detail-drawer { width: min(680px, 94vw); }
  .detail-list { grid-template-columns: 96px 1fr; }
}
@media (min-width: 1050px) {
  .top-nav { display: flex; }
  .analysis-grid { grid-template-columns: repeat(12, 1fr); gap: 12px; }
  .analysis-panel { grid-column: span 6; }
  .analysis-panel.wide { grid-column: span 8; }
  .analysis-panel.full { grid-column: 1 / -1; }
  .city-row { display: grid; grid-template-columns: 68px minmax(120px, 1.4fr) 68px 92px 100px; gap: 14px; }
  .city-track { flex: none; }
  .city-date { display: block; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
@media print {
  .app-header, .page-actions, .filter-bar, .filter-status, .panel-settings, .pagination, .drawer-mask, .detail-drawer, .toast { display: none !important; }
  body { background: #ffffff; color: #000000; }
  .workspace { max-width: none; padding: 0; }
  .analysis-panel, .kpi-card, .table-container { break-inside: avoid; }
}
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<header class="app-header">
  <div class="header-inner">
    <a class="brand" href="./" aria-label="发改批复监测工作台首页">
      <span class="brand-name">发改批复监测</span>
      <span class="brand-scope">酉阳 / 秀山</span>
    </a>
    <nav class="top-nav" aria-label="页面导航">
      <a href="#analysis">分析总览</a>
      <a href="#projects">项目明细</a>
      <a href="#sources">数据来源</a>
    </nav>
    <div class="header-actions">
      <span class="update-time" id="headerUpdated"></span>
      <button class="button button-quiet" id="themeButton" type="button">深色模式</button>
    </div>
  </div>
</header>

<main class="workspace" id="main">
  <section class="page-heading" aria-labelledby="pageTitle">
    <div>
      <h1 id="pageTitle">批复监测总览</h1>
      <p id="pageSummary">官方公开信息的统一检索、比较与追溯</p>
    </div>
    <div class="page-actions">
      <details class="panel-settings" id="panelSettings">
        <summary class="button">模块</summary>
        <div class="panel-menu" id="panelMenu"></div>
      </details>
      <button class="button" id="copyViewButton" type="button">复制视图链接</button>
      <button class="button button-primary" id="exportButton" type="button">导出当前结果</button>
    </div>
  </section>

  <section class="filter-bar" aria-label="全局筛选">
    <div class="filter-field filter-city">
      <span class="field-label">城市</span>
      <div class="segmented" id="cityFilters"></div>
    </div>
    <label class="filter-field">
      <span class="field-label">统计时段</span>
      <select id="periodFilter">
        <option value="all">全部监控周期</option>
        <option value="90">近 90 天</option>
        <option value="30">近 30 天</option>
      </select>
    </label>
    <label class="filter-field">
      <span class="field-label">批复类型</span>
      <select id="categoryFilter"><option value="all">全部类型</option></select>
    </label>
    <label class="filter-field filter-search">
      <span class="field-label">关键词</span>

/* 模块容器模板：负责面板骨架、显隐、错误隔离与第三方模块注册。
 * 模块协议：
 * {
 *   id: 'trend',                 // 必填，唯一
 *   title: '月度发布趋势',        // 必填
 *   subtitle: '按发布日期聚合',    // 可选
 *   description: '模块说明',       // 可选，用于模块菜单
 *   size: 'wide',                // 可选：默认 / wide / full
 *   defaultVisible: false,       // 可选，默认 false
 *   render(slots, context) {}    // 必填；slots = { header, toolbar, body, footer }
 *   destroy() {}                 // 可选，卸载或重渲染前清理
 * }
 */
class ModuleHost {
  constructor(options) {
    this.section = options.section;
    this.grid = options.grid;
    this.menu = options.menu;
    this.storageKey = options.storageKey || 'fagai-module-visibility';
    this.onVisibilityChange = options.onVisibilityChange || (() => {});
    this.modules = [];
    this.visibility = this.readVisibility();
    this.ready = false;
    this.menu.addEventListener('click', event => this.handleMenuClick(event));
  }

  readVisibility() {
    try { return JSON.parse(localStorage.getItem(this.storageKey)) || {}; }
    catch (error) { return {}; }
  }

  writeVisibility() {
    try { localStorage.setItem(this.storageKey, JSON.stringify(this.visibility)); }
    catch (error) {}
  }

  register(module) {
    if (!module || !module.id || !module.title || typeof module.render !== 'function') {
      throw new TypeError('模块必须提供 id、title 和 render(slots, context)');
    }
    const existingIndex = this.modules.findIndex(entry => entry.id === module.id);
    if (existingIndex >= 0) {
      const previous = this.modules[existingIndex];
      if (typeof previous.destroy === 'function') previous.destroy();
      this.modules.splice(existingIndex, 1, module);
    } else {
      this.modules.push(module);
    }
    if (typeof this.visibility[module.id] !== 'boolean') {
      this.visibility[module.id] = module.defaultVisible === true;
    }
    this.renderMenu();
    if (this.ready) this.render(this.lastContext || {});
    return module;
  }

  list() {
    return this.modules.map(module => ({
      id: module.id,
      title: module.title,
      description: module.description || '',
      size: module.size || '',
      visible: this.visibility[module.id] === true,
    }));
  }

  setVisible(id, visible) {
    if (!this.modules.some(module => module.id === id)) return;
    this.visibility[id] = visible;
    this.writeVisibility();
    this.renderMenu();
    this.render(this.lastContext || {});
    this.onVisibilityChange();
  }

  handleMenuClick(event) {
    const button = event.target.closest('[data-module]');
    if (button) this.setVisible(button.dataset.module, button.getAttribute('aria-checked') !== 'true');
  }

  renderMenu() {
    if (!this.menu) return;
    this.menu.innerHTML = this.modules.map(module => {
      const checked = this.visibility[module.id] ? 'true' : 'false';
      return '<button type="button" role="switch" aria-checked="' + checked + '" class="panel-option" data-module="' + module.id + '">'
        + '<span class="switch-mark" aria-hidden="true"></span><span>' + module.title
        + '<small>' + (module.description || '第三方分析模块') + '</small></span></button>';
    }).join('') || '<div class="chart-empty">暂无可注册模块</div>';
  }

  render(context) {
    this.lastContext = context;
    const visible = this.modules.filter(module => this.visibility[module.id]);
    if (this.section) this.section.hidden = visible.length === 0;
    this.grid.innerHTML = '';
    visible.forEach(module => {
      const panel = document.createElement('article');
      panel.className = 'analysis-panel ' + (module.size || '');
      panel.dataset.moduleId = module.id;
      panel.innerHTML =
        '<header class="panel-header"><div><h3></h3><p></p></div><div class="module-toolbar" data-slot="toolbar"></div></header>' +
        '<div class="panel-body" data-slot="body"></div>' +
        '<footer class="module-footer" data-slot="footer"></footer>';
      const slots = {
        header: panel.querySelector('.panel-header div'),
        toolbar: panel.querySelector('[data-slot="toolbar"]'),
        body: panel.querySelector('[data-slot="body"]'),
        footer: panel.querySelector('[data-slot="footer"]'),
      };
      slots.header.querySelector('h3').textContent = module.title;
      slots.header.querySelector('p').textContent = module.subtitle || '';
      slots.header.querySelector('p').hidden = !module.subtitle;
      this.grid.appendChild(panel);
      try {
        module.render(slots, context);
      } catch (error) {
        slots.toolbar.innerHTML = '';
        slots.footer.innerHTML = '';
        slots.body.innerHTML = '<div class="chart-empty">模块暂时无法显示</div>';
        console.error('分析模块渲染失败：' + module.id, error);
      }
    });
  }

  mount() {
    this.ready = true;
    this.renderMenu();
  }
}

'use strict';

const ALL = DB.cities.flatMap(city => city.items);
const CITY_MAP = new Map(DB.cities.map(city => [city.key, city]));
const PAGE_SIZE = 10;
const DEFAULT_STATE = {
  city: 'all', period: 'all', category: 'all', month: '', q: '',
  metric: 'count', sort: 'date', direction: 'desc', page: 1,
};
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[char]));
const money = (value, empty = '未披露') => {
  if (!value) return empty;
  if (value >= 10000) return (value / 10000).toFixed(2).replace(/\.?0+$/, '') + ' 亿';
  return value.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + ' 万';
};
const metricValue = (items, metric) => metric === 'investment'
  ? items.reduce((sum, item) => sum + item.investment, 0)
  : items.length;
const formatMetric = (value, metric) => metric === 'investment' ? money(value, '0 万') : value + ' 个';
const cityColor = key => (CITY_MAP.get(key) || {}).accent || '#2f5f9e';
let toastTimer;
let lastFocusedElement;

function readStorage(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (error) { return fallback; }
}
function writeStorage(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (error) {}
}
function initialState() {
  const params = new URLSearchParams(location.search);
  const categories = new Set(ALL.map(item => item.category));
  const next = { ...DEFAULT_STATE };
  const city = params.get('city');
  const period = params.get('period');
  const category = params.get('category');
  const month = params.get('month') || '';
  const metric = params.get('metric');
  const sort = params.get('sort');
  const direction = params.get('direction');
  if (city === 'all' || CITY_MAP.has(city)) next.city = city;
  if (['all', '90', '30'].includes(period)) next.period = period;
  if (category === 'all' || categories.has(category)) next.category = category;
  if (/^\d{4}-\d{2}$/.test(month)) next.month = month;
  next.q = (params.get('q') || '').slice(0, 120);
  if (['count', 'investment'].includes(metric)) next.metric = metric;
  if (['date', 'cityName', 'category', 'name', 'investment', 'docNo'].includes(sort)) next.sort = sort;
  if (['asc', 'desc'].includes(direction)) next.direction = direction;
  return next;
}
let state = initialState();

function syncUrl() {
  const params = new URLSearchParams();
  ['city', 'period', 'category', 'month', 'q', 'metric', 'sort', 'direction'].forEach(key => {
    const value = state[key];
    if (value && value !== DEFAULT_STATE[key]) params.set(key, value);
  });
  const query = params.toString();
  try { history.replaceState(null, '', location.pathname + (query ? '?' + query : '') + location.hash); } catch (error) {}
}
function periodStart() {
  if (state.period === 'all') return '';
  const date = new Date(DB.dateTo + 'T00:00:00Z');
  date.setUTCDate(date.getUTCDate() - Number(state.period) + 1);
  return date.toISOString().slice(0, 10);
}
function getFilteredItems(ignore = {}) {
  const start = periodStart();
  const query = state.q.trim().toLowerCase();
  return ALL.filter(item => {
    if (!ignore.city && state.city !== 'all' && item.city !== state.city) return false;
    if (!ignore.period && start && item.date < start) return false;
    if (!ignore.category && state.category !== 'all' && item.category !== state.category) return false;
    if (!ignore.month && state.month && !item.date.startsWith(state.month)) return false;
    if (!ignore.q && query) {
      const text = (item.name + ' ' + item.unit + ' ' + item.docNo + ' ' + item.title).toLowerCase();
      if (!query.split(/\s+/).every(word => text.includes(word))) return false;
    }
    return true;
  });
}
function getSortedItems(items) {
  const direction = state.direction === 'asc' ? 1 : -1;
  return items.slice().sort((a, b) => {
    if (state.sort === 'investment') return (a.investment - b.investment) * direction;
    return String(a[state.sort] || '').localeCompare(String(b[state.sort] || ''), 'zh-CN') * direction;
  });
}
function setState(patch) {
  state = { ...state, ...patch };
  if (!Object.prototype.hasOwnProperty.call(patch, 'page')) state.page = 1;
  renderAll();
}
function resetFilters() {
  setState({ city: 'all', period: 'all', category: 'all', month: '', q: '', page: 1 });
  $('searchFilter').value = '';
}

}

function moduleContext(items) {

function monthsBetween(from, to) {
  let [year, month] = from.slice(0, 7).split('-').map(Number);
  const [endYear, endMonth] = to.slice(0, 7).split('-').map(Number);
  const months = [];
  while (year < endYear || (year === endYear && month <= endMonth)) {
    months.push(year + '-' + String(month).padStart(2, '0'));
    month += 1;
    if (month === 13) { year += 1; month = 1; }
  }
  return months;
}

function renderTrend(slots, context) {
  const items = context.getItems({ month: true });
  const months = monthsBetween(DB.dateFrom, DB.dateTo);
  const cities = context.state.city === 'all' ? context.cities : context.cities.filter(city => city.key === context.state.city);
  const metric = context.state.metric;
  const values = cities.map(city => months.map(month => context.metricValue(items.filter(item => item.city === city.key && item.date.startsWith(month)), metric)));
  const max = Math.max(1, ...values.flat());
  slots.toolbar.innerHTML = '<div class="metric-switch"><button type="button" data-metric="count" class="' + (metric === 'count' ? 'active' : '') + '">项目数</button><button type="button" data-metric="investment" class="' + (metric === 'investment' ? 'active' : '') + '">投资额</button></div>';
  slots.body.innerHTML = '<div class="chart-legend"><div class="legend-items">' + cities.map(city => '<span><i class="legend-mark" style="background:' + city.accent + '"></i>' + esc(city.shortName) + '</span>').join('') + '</div></div>'
    + '<div class="trend-chart">' + months.map((month, monthIndex) => {
      const bars = cities.map((city, cityIndex) => {
        const value = values[cityIndex][monthIndex];
        const height = value ? Math.max(4, value / max * 150) : 0;
        return '<button type="button" class="trend-bar" data-month="' + month + '" style="height:' + height + 'px;background:' + city.accent + '" data-tooltip="' + esc(city.shortName + ' · ' + month + ' · ' + formatMetric(value, metric)) + '" aria-label="' + esc(city.shortName + month + formatMetric(value, metric) + '，点击筛选该月') + '"></button>';
      }).join('');
      return '<div class="trend-month ' + (context.state.month === month ? 'selected' : '') + '"><div class="trend-bars">' + bars + '</div><div class="trend-label">' + Number(month.slice(5)) + '月</div></div>';
    }).join('') + '</div>';
  slots.footer.innerHTML = '<span>点击柱形筛选月份，再次点击取消筛选</span>';
  slots.toolbar.querySelectorAll('[data-metric]').forEach(button => button.addEventListener('click', () => context.setState({ metric: button.dataset.metric })));
  slots.body.querySelectorAll('[data-month]').forEach(button => button.addEventListener('click', () => context.setState({ month: context.state.month === button.dataset.month ? '' : button.dataset.month })));
}

function renderCategories(slots, context) {
  const items = context.getItems({ category: true });
  const metric = context.state.metric;
  const groups = new Map();
  items.forEach(item => {
    if (!groups.has(item.category)) groups.set(item.category, []);
    groups.get(item.category).push(item);
  });
  const entries = [...groups.entries()].map(([name, group]) => ({ name, value: context.metricValue(group, metric) })).sort((a, b) => b.value - a.value);
  if (!entries.length) {
    slots.body.innerHTML = '<div class="chart-empty">当前条件下没有类型数据</div>';
    slots.footer.innerHTML = '';
    return;
  }
  const max = Math.max(1, ...entries.map(entry => entry.value));
  slots.body.innerHTML = '<div class="chart-legend"><span>' + (metric === 'count' ? '按项目数量' : '按披露投资额') + '</span><span>点击类型可筛选</span></div><div class="category-list">'
    + entries.map(entry => '<button type="button" class="category-row ' + (context.state.category === entry.name ? 'selected' : '') + '" data-category="' + esc(entry.name) + '"><span class="category-name">' + esc(entry.name) + '</span><span class="category-track"><span class="category-fill" style="display:block;width:' + Math.max(1, entry.value / max * 100) + '%"></span></span><span class="category-value">' + formatMetric(entry.value, metric) + '</span></button>').join('') + '</div>';
  slots.footer.innerHTML = '<span>类型与项目明细联动，再次点击取消筛选</span>';
  slots.body.querySelectorAll('[data-category]').forEach(button => button.addEventListener('click', () => context.setState({ category: context.state.category === button.dataset.category ? 'all' : button.dataset.category })));
}

function renderCityComparison(slots, context) {
  const items = context.getItems({ city: true });
  const metric = context.state.metric;
  const rows = context.cities.map(city => {
    const cityItems = items.filter(item => item.city === city.key);
    const latest = cityItems.map(item => item.date).sort().pop() || '无数据';
    return { city, items: cityItems, value: context.metricValue(cityItems, metric), latest };
  });
  const max = Math.max(1, ...rows.map(row => row.value));
  slots.body.innerHTML = '<div class="chart-legend"><span>' + (metric === 'count' ? '条形长度表示项目数量' : '条形长度表示披露投资额') + '</span><span>点击城市名称可筛选</span></div><div class="city-compare">'
    + rows.map(row => '<div class="city-row"><button type="button" class="city-name city-select" data-city="' + row.city.key + '"><i class="legend-mark" style="background:' + row.city.accent + '"></i>' + esc(row.city.shortName) + '</button><span class="city-track"><span class="city-fill" style="display:block;width:' + (row.value ? Math.max(1, row.value / max * 100) : 0) + '%;background:' + row.city.accent + '"></span></span><span class="city-number">' + row.items.length + ' 个</span><span class="city-number">' + money(row.items.reduce((sum, item) => sum + item.investment, 0), '0 万') + '</span><span class="city-date">' + row.latest + '</span></div>').join('') + '</div>';
  slots.footer.innerHTML = '<span>其他城市保持可见，作为当前筛选的参照</span>';

}

function renderTable(items) {
  const sorted = getSortedItems(items);
  const pages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  state.page = Math.min(Math.max(1, state.page), pages);
  const start = (state.page - 1) * PAGE_SIZE;
  const pageItems = sorted.slice(start, start + PAGE_SIZE);
  $('projectTableBody').innerHTML = pageItems.map(item => '<tr tabindex="0" data-id="' + item.id + '" aria-label="查看' + esc(item.name) + '详情">'
    + '<td class="cell-date">' + item.date + '</td><td><span class="cell-city"><i class="legend-mark" style="background:' + cityColor(item.city) + '"></i>' + esc(item.cityName) + '</span></td><td class="cell-category">' + esc(item.category) + '</td>'
    + '<td><span class="project-name" title="' + esc(item.name) + '">' + esc(item.name || item.title) + '</span><span class="project-unit">' + esc(item.unit || '建设单位未披露') + '</span></td>'
    + '<td class="cell-money numeric">' + money(item.investment) + '</td><td class="cell-doc">' + esc(item.docNo || '未披露') + '</td></tr>').join('');
  $('emptyState').hidden = sorted.length > 0;
  $('tableMeta').textContent = '当前结果 ' + sorted.length + ' 条';
  $('tablePageSummary').textContent = sorted.length ? '显示第 ' + (start + 1) + ' 至 ' + Math.min(start + PAGE_SIZE, sorted.length) + ' 条' : '没有可显示的记录';
  $('pageIndicator').textContent = state.page + ' / ' + pages;
  $('previousPage').disabled = state.page <= 1;
  $('nextPage').disabled = state.page >= pages;
  document.querySelectorAll('.sort-button').forEach(button => {
    const active = button.dataset.sort === state.sort;
    button.classList.toggle('active', active);
    button.classList.toggle('ascending', active && state.direction === 'asc');
    button.setAttribute('aria-sort', active ? (state.direction === 'asc' ? 'ascending' : 'descending') : 'none');
  });
}

function exportCsv() {
  const rows = getSortedItems(getFilteredItems());
  const header = ['发布日期', '城市', '批复类型', '项目名称', '建设单位', '投资额（万元）', '批复文号', '成文日期', '官方原文'];
  const quote = value => '"' + String(value ?? '').replaceAll('"', '""') + '"';
  const lines = [header, ...rows.map(item => [item.date, item.cityName, item.category, item.name, item.unit, item.investment || '', item.docNo, item.docDate, item.url])];
  const csv = '﻿' + lines.map(row => row.map(quote).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = '发改批复_' + DB.dateTo + '_' + rows.length + '条.csv';
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  showToast('已导出 ' + rows.length + ' 条当前结果');
}

$('nextPage').addEventListener('click', () => setState({ page: state.page + 1 }));
$('drawerClose').addEventListener('click', closeDetail);
$('drawerMask').addEventListener('click', closeDetail);
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') { closeDetail(); $('panelSettings').open = false; }
  if (event.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    event.preventDefault();
    $('searchFilter').focus();
  }
});
document.addEventListener('click', event => {
  if (!event.target.closest('#panelSettings')) $('panelSettings').open = false;
});

async function loadExternalPlugins() {
  if (location.protocol === 'file:') return;
  try {
    const base = new URL('plugins/', location.href);
    const response = await fetch(new URL('manifest.json', base), { cache: 'no-store' });
    if (!response.ok) return;
    const manifest = await response.json();
    for (const entry of manifest.plugins || []) {
      const modulePath = typeof entry === 'string' ? entry : entry.module;
      if (!modulePath) continue;
      try { await import(new URL(modulePath, base).href); }
      catch (error) { console.error('第三方分析模块加载失败：' + modulePath, error); }
    }
  } catch (error) {
    console.warn('未读取到第三方分析模块清单', error);
  }
}

$('categoryFilter').innerHTML = '<option value="all">全部类型</option>' + [...new Set(ALL.map(item => item.category))].sort().map(category => '<option value="' + esc(category) + '">' + esc(category) + '</option>').join('');
$('searchFilter').value = state.q;
$('searchFilter').title = '按 / 可快速聚焦搜索';
applyTheme(readStorage('fagai-theme', 'light'));
renderSources();
moduleHost.mount();
renderAll();
loadExternalPlugins();

</script>
</body>
</html>
